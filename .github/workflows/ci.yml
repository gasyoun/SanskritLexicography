name: CI

# Baseline CI for generic / satellite repos.
# Language-agnostic checks: markdown lint, link check, YAML lint,
# plus opportunistic language-specific lint if package.json/requirements.txt present.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Lint markdown (warnings only)
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#RussianTranslation/glossary/md" || echo "::warning::Markdown lint issues found"

  # Markdown link check moved to .github/workflows/link-check.yml (weekly
  # schedule + manual dispatch): it burned ~47 min on every push/PR while
  # continue-on-error made it advisory-only — zero enforcement value per run.

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
      - run: pip install pyyaml
      - name: Validate all YAML
        run: |
          python -c "
          import sys, glob, yaml
          fail = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              if '.git' in f: continue
              try:
                  with open(f, encoding='utf-8') as fh: yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  print(f'::error file={f}::{e}'); fail = 1
          sys.exit(fail)
          "

  # Conditional Python lint
  python-lint:
    name: Python lint (if any .py present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if find . -name "*.py" -not -path "./.git/*" | head -1 | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.has_python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - if: steps.check.outputs.has_python == 'true'
        run: pip install ruff
      - if: steps.check.outputs.has_python == 'true'
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .

  russian-translation-gates:
    name: RussianTranslation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the changelog guard diffs HEAD~1..HEAD on push; depth 1 has no HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Compile gate scripts
        run: |
          # ALL tracked top-level src scripts (:(glob) keeps * non-recursive);
          # pilot/ stays an explicit list — untracked scratch does not exist in CI
          git ls-files ':(glob)RussianTranslation/src/*.py' | xargs python -m py_compile
          python -m py_compile \
            RussianTranslation/src/pilot/proc_tree.py \
            RussianTranslation/src/pilot/call_reservation.py \
            RussianTranslation/src/pilot/headless_worker.py \
            RussianTranslation/src/pilot/max_account_orchestrator.py \
            RussianTranslation/src/pilot/bounded_staged_run.py \
            RussianTranslation/src/pilot/bounded_supervisor.py \
            RussianTranslation/src/pilot/coordinator.py \
            RussianTranslation/src/pilot/promotion_journal.py \
            RussianTranslation/src/pilot/h963_c4_gate0_probe.py \
            RussianTranslation/src/pilot/latency_payload_sweep.py \
            RussianTranslation/src/pilot/windows100_selftest.py \
            RussianTranslation/src/pilot/run_observability.py \
            RussianTranslation/src/pilot/run_observability_selftest.py \
            RussianTranslation/src/pilot/build_edition_diff_site.py
          git ls-files ':(glob)RussianTranslation/src/eval/*.py' | xargs python -m py_compile
      - name: Sa->Ru gloss pipeline unit tests (H1349 waves 1-4)
        working-directory: RussianTranslation
        run: |
          # Pure-helper regression tests for the wave-1 defect fixes, the wave-2
          # precision-panel scaffold, the wave-3 compound-split gate, and the wave-4
          # read-only gloss TM lookup. The build_*.py and saru_gloss_*.py modules
          # import cleanly because their heavy deps (vidyut, vidyut.cheda,
          # indic_transliteration) are imported lazily inside main()/to_slp1().
          # H2254: `jsonschema` joins pytest here. rv_spine_build.validate_jsonl imports it
          # lazily, and the committed RV spine JSONL it validates IS present in CI -- so
          # unlike the sibling-data tests (which skip, because their data genuinely is not
          # there) this one was a real, fixable missing dependency, not a false red. It only
          # became visible once the whole-suite gate stopped dying at collection.
          pip install pytest jsonschema
          pytest tests/test_saru_gloss_pipeline.py tests/test_saru_gloss_wave2.py tests/test_saru_gloss_wave3.py tests/test_saru_gloss_tm.py -q
      - name: Install the shared review-sheet emitter (H1808)
        # g5_card_render imports csl_pyutil.anatomy at module load, so this lane
        # needs the package rather than just py_compile. Pinned to the TAG, not
        # `@main` as the repo requirements.txt does, so a CI run stays reproducible.
        #
        # H2254 (07-08-2026): MOVED UP, from after the TM-hardening lane to here.
        # The H2252 truth gate below collects the WHOLE suite, and two of its tests
        # (test_nws_ls_markup.py, test_rv_spine.py) transitively import csl_pyutil --
        # so with the install still downstream, `pytest tests -q` died at COLLECTION
        # with ModuleNotFoundError and the job exited 2 before reaching this step.
        # CI was red at master HEAD for this reason. It is the H2252 defect class in
        # its ordering form: a step that runs the whole suite has to be preceded by
        # every dependency the named steps install piecemeal, and nothing enforced
        # that. Keep this install ABOVE the truth gate.
        run: pip install "csl-pyutil @ git+https://github.com/sanskrit-lexicon/csl-pyutil@v0.7.0"
      - name: Complete subsystem test suite (H2252 truth gate)
        working-directory: RussianTranslation
        run: |
          # H2252: every step above names its files individually, so a test file
          # nobody listed could rot indefinitely -- test_nws_ls_markup.py sat RED
          # for weeks against a green CI head, still asserting the fixed `.h1809.bak`
          # name H2146 replaced with the shared unique-backup writer. This step is
          # additive: the focused steps keep their fast, named signal, and this one
          # makes "the suite passes" mean the WHOLE suite.
          pytest tests -q
      - name: BLI eval harness fixture selftest (H1521)
        working-directory: RussianTranslation
        run: python src/eval/bli_eval.py selftest
      - name: Validate research-layer sidecars (capability cards 5, 23)
        working-directory: RussianTranslation
        run: |
          # H1902: worktree-safe sibling-root resolution -- proves both the
          # unpinned-warn and pinned-raise directions (FINDINGS #503).
          python src/sibling_root.py --selftest
          python src/mw_compounds.py --selftest
          python src/mfs_baseline.py --selftest
          python src/government_census.py selftest
          python src/government_sidecar.py --selftest
          python src/pilot/build_article_site.py --selftest
          python src/pilot/build_edition_diff_site.py --selftest
          python research/build_observatory.py --check
      - name: Publication-grade TM technical-hardening selftests (H1457 Track A)
        working-directory: RussianTranslation
        run: |
          # Fixture-only, deterministic -- no network/model calls. The scripts'
          # OWN live/pilot subcommands (nn_api --smoketest, tm_saru_align_labse
          # pilot, mined_filter_bicleaner report) need sentence-transformers +
          # the real gold/corpus files and are deliberately NOT run here, same
          # as this job never runs a bulk translation pass.
          python src/tm_grade.py selftest
          python src/tm_align.py selftest
          python src/build_grade_gold.py selftest
          python src/mined_filter_bicleaner.py selftest
          python src/tm_saru_align_labse.py selftest
          python src/tm_retrieval_eval.py selftest
      - name: Review-sheet binding + decisions + residue-gate selftests (H1404 lane)
        working-directory: RussianTranslation
        run: |
          # Fixture-only. review_residue_gate needs the committed H1303
          # inventory (pwg_ru/ABBREV_UNIFIED_LIST_PROPOSAL_2026-07.md) and the
          # pwgab table; apply_decisions pins the positional-id drift fallback
          # (g5-live-queue-batch1, 26-07-2026).
          python src/review_binding.py --selftest
          python src/validate_decisions.py --selftest
          python src/apply_decisions.py --selftest
          python src/review_residue_gate.py --selftest
          python src/pilot/german_residue_scan.py --selftest
          # H1801 G6 evidence panels. Fixture-only by construction: none of the
          # eight source assets (csl-orig, SanskritRussian, MWS, WhitneyRoots,
          # SamudraManthanam) is checked out here, and sanskrit-util is absent
          # too, so this also exercises the markup fallback path.
          python src/gold_evidence_panel.py --selftest
          # H1808 G5 card rendering (Cologne <ls> links, NWS bracket tooltips,
          # anatomy panels). Table-dependent checks self-skip: pwgab/pwgbib live
          # in the sibling csl-pywork checkout, absent here, which also exercises
          # the no-tooltip degradation path.
          python src/g5_card_render.py
          # H1847 NWS tag vocabulary: the in-card legend + the facet bar.
          # Fixture-only — neither the queue nor the store is checked out here.
          # The census aggregate IS committed (counts only), so the corpus-share
          # path runs for real rather than self-skipping.
          python src/nws_tag_census.py --selftest
          python src/build_g5_review_sheet.py --selftest
      - name: LOD graph acceptance (fixture-only, H350/E7)
        working-directory: RussianTranslation
        run: |
          pip install rdflib pyshacl
          python src/lod_acceptance.py --cards /nonexistent
      - name: Validate PWG production runtime and failure contracts
        working-directory: RussianTranslation
        run: |
          python src/pilot/agent_budget.py
          python src/pilot/call_reservation_selftest.py
          python src/pilot/headless_worker_selftest.py
          python src/pilot/execution_contract_selftest.py
          python src/pilot/max_account_orchestrator_selftest.py
          python src/pilot/coordinator_hardening_selftest.py
          python src/pilot/promotion_journal_selftest.py
          python src/pilot/windows100_selftest.py
          python src/pilot/run_observability_selftest.py
          python src/pilot/economy_ledger_selftest.py
          python src/pilot/bounded_supervisor_selftest.py
          python src/pilot/bounded_staged_run_selftest.py
          python src/pilot/sense_count.py
          python src/pilot/window_selftest.py
          python src/store_path.py --selftest
          python src/promote_final_cards.py --selftest
          python src/pilot/translation_memory.py selftest
          python src/citation_tm.py selftest
          python src/build_ramayana_concordance.py selftest
          python src/build_mbh_concordance.py selftest
          python src/pilot/lang_parity_check.py
          python src/pilot/check_launch_ledger.py --since 2026-07-05
      - name: Validate nonstop multilane runtime (H2175 wave 1)
        working-directory: RussianTranslation
        run: |
          python src/pilot/data_root.py --selftest
          python src/pilot/parked_queue.py --selftest
          python src/pilot/spot_check_daily.py --selftest
          python src/pilot/lane_guard.py --selftest
          python src/pilot/lane_spotcheck_tick.py --selftest
          python src/pilot/nonstop_scheduler.py --selftest
          python src/pilot/digest_daily.py --selftest
          python src/pilot/weekly_packet.py --selftest
          python src/pilot/data_inventory.py --selftest
          python src/pilot/data_migrate.py --selftest
          python src/pilot/cloud_window.py
          python src/pilot/openrouter_worker.py --selftest
          python src/pilot/ci_gate_runner.py --selftest
          python src/pilot/marker_scan.py
          python src/pilot/h963_c4_gate0_probe.py --selftest
          python src/pilot/h1339_offline_bench.py --selftest
      - name: Byte-identity control — h1339 offline bench signature (H2253, #1000)
        working-directory: RussianTranslation
        run: |
          # #1000: the deterministic-output control used to be a hex string quoted in
          # prose. It was carried across at least three close-outs that each RECORDED it
          # as "unchanged", and it reproduces at no commit -- because nobody ever re-ran
          # the bench to check. An unexecuted control is not a control.
          #
          # One measured run (no warmups) is enough: the bench's own determinism check
          # runs inside it, and this step exists to catch a MOVED signature, not to
          # re-measure timings. A mismatch here means the offline pipeline's output
          # changed -- read the printed fixture hash before re-pinning, and never copy
          # the new value into prose instead of into this line.
          python src/pilot/h1339_offline_bench.py --warmups 0 --runs 1 \
            --expect-signature 586d012b3d
      - name: Validate <ls> link enrichment (Panini + Spr. (II), H1307)
        working-directory: RussianTranslation
        run: python src/pilot/ls_enrichment_selftest.py
      - name: Validate roadmap
        working-directory: RussianTranslation
        run: python src/roadmap_check.py
      - name: Validate final-card schema fixture
        working-directory: RussianTranslation
        run: |
          python src/validate_final_card_schema.py
          python src/validate_final_card_schema.py --selftest
          python src/validate_assembled_export.py --cards src/fixtures/assembled_card.fixture.jsonl --quarantine src/fixtures/assembled_quarantine.fixture.jsonl --min-cards 1
      - name: Check pilot workflow syntax
        working-directory: RussianTranslation
        run: node --check src/pilot/run_pilot_wf.js
      - name: Guard review changelog updates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            python RussianTranslation/src/review_changelog_guard.py --base FETCH_HEAD --head HEAD
          else
            python RussianTranslation/src/review_changelog_guard.py --base HEAD~1 --head HEAD
          fi
      - name: Validate review gate fixtures
        working-directory: RussianTranslation
        run: |
          cp src/fixtures/review_store.fixture.jsonl "$RUNNER_TEMP/review_store.jsonl"
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py validate_review src/fixtures/review_queue.blank.fixture.csv
          if PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py validate_review src/fixtures/review_queue.bad_missing_reviewer.fixture.csv; then
            echo "expected missing-reviewer fixture to fail"
            exit 1
          fi
          if PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py validate_review src/fixtures/review_queue.bad_non_machine_ok.fixture.csv; then
            echo "expected non-machine-ok approval fixture to fail"
            exit 1
          fi
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py validate_review src/fixtures/review_queue.apply.fixture.csv
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" PWG_RU_REVIEW_REPORT="$RUNNER_TEMP/review_readiness_report.md" python src/run_batch.py review_report src/fixtures/review_queue.apply.fixture.csv
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py apply_review src/fixtures/review_queue.apply.fixture.csv
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/run_batch.py status
          PWG_RU_STORE="$RUNNER_TEMP/review_store.jsonl" python src/release_readiness.py --release-dir "$RUNNER_TEMP" --out "$RUNNER_TEMP/readiness_after_review.md"
          python - <<'PY'
          import json, os
          rows = [json.loads(line) for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'review_store.jsonl'), encoding='utf-8')]
          by_ord = {r['ord']: r for r in rows}
          assert by_ord[1]['review_status'] == 'human_reviewed'
          assert by_ord[1]['ru'] == 'исправленный огонь'
          assert by_ord[1]['reviewer'] == 'editor-a'
          assert by_ord[2]['review_status'] == 'approved'
          assert by_ord[3]['review_status'] == 'needs_review'
          assert by_ord[4]['review_status'] == 'needs_review'
          print('review apply fixture OK')
          PY
          python src/export_interop.py all --cards src/fixtures/assembled_card.fixture.jsonl --store "$RUNNER_TEMP/review_store.jsonl" --out-dir "$RUNNER_TEMP/review_interop"
          python src/validate_interop.py --dir "$RUNNER_TEMP/review_interop"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'review_interop', 'reverse_index.jsonl')
          lemmas = {json.loads(line)['ru'] for line in open(path, encoding='utf-8') if line.strip()}
          assert 'исправленный' in lemmas
          assert 'жертвенный' in lemmas
          assert 'запретный' not in lemmas
          assert 'отклоненный' not in lemmas
          print('fail-closed export fixture OK')
          PY
      - name: Validate gold fixture
        working-directory: RussianTranslation
        run: |
          python src/gold_validate.py src/fixtures/human_gold_review.fixture.csv --expect 3
          python src/gold_status.py src/fixtures/human_gold_review.fixture.csv
          python src/gold_packet.py src/fixtures/human_gold_scaffold.fixture.csv --batch-size 2 --out-dir "$RUNNER_TEMP/gold_packets"
          python src/gold_packet_verify.py src/fixtures/human_gold_scaffold.fixture.csv "$RUNNER_TEMP/gold_packets"
          python src/gold_double_review_queue.py src/fixtures/human_gold_scaffold.fixture.csv --sample-size 3 --out "$RUNNER_TEMP/double_review_queue.csv"
          python src/gold_double_review_verify.py "$RUNNER_TEMP/double_review_queue.csv" --sample-size 3
          python src/gold_ingest.py src/fixtures/human_gold_review.fixture.csv "$RUNNER_TEMP/human_gold_labels.fixture.jsonl"
          python src/gold_ingest_double_review.py src/fixtures/double_review_queue.fixture.csv "$RUNNER_TEMP/double_review_labels.fixture.jsonl"
          python src/gold_agreement.py "$RUNNER_TEMP/human_gold_labels.fixture.jsonl" "$RUNNER_TEMP/gold_reports" --fixture
          python src/gold_agreement.py "$RUNNER_TEMP/double_review_labels.fixture.jsonl" "$RUNNER_TEMP/double_review_reports" --fixture
      - name: Validate interop and release fixtures
        working-directory: RussianTranslation
        run: |
          python src/export_interop.py all --cards src/fixtures/assembled_card.fixture.jsonl --out-dir "$RUNNER_TEMP/interop_fixture"
          python src/validate_interop.py --dir "$RUNNER_TEMP/interop_fixture"
          python src/release_readiness.py --release-dir "$RUNNER_TEMP/interop_fixture" --out "$RUNNER_TEMP/readiness_report.md"
          python src/preflight_remaining_gates.py --release-dir "$RUNNER_TEMP/interop_fixture" --readiness-out "$RUNNER_TEMP/preflight_readiness_report.md" --skip-local-human-artifacts
          python src/make_edition_cut.py edition_fixture --cards src/fixtures/assembled_card.fixture.jsonl --release-root "$RUNNER_TEMP/release_fixture" --source-release "$RUNNER_TEMP/release_fixture/source"
          python src/validate_release.py "$RUNNER_TEMP/release_fixture/edition_fixture"

  docs-site:
    name: docs_site build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest docs_site/test_docs_site.py -q

  # Conditional JS lint
  js-lint:
    name: JS lint (if package.json present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.check.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - if: steps.check.outputs.has_pkg == 'true'
        run: npm install
      - if: steps.check.outputs.has_pkg == 'true'
        run: npm test --if-present
